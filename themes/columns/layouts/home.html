<!doctype html>
<html lang="en" data-layout="home">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} · The Columns</title>
    <link rel="stylesheet" href="{{asset-url assets/css/columns.css}}">
      {{head}}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to the front page</a>
    <div class="sheet">
      <header class="masthead">
        <div class="press-line"><span>Late edition</span><div class="press-trail">{{breadcrumb}}</div><span>Filed nightly</span></div>
        <p class="nameplate">The Columns</p>
        <p class="motto">Every story gets its column.</p>
        <div class="desks-bar" data-boris-search-exclude>{{nav}}</div>
      </header>
      <div class="paper">
        <main id="content" class="story" tabindex="-1" data-boris-search-root>
          <header class="story-head">
            <p class="rubric" data-boris-search-exclude>Front page</p>
            <p class="press-stamp" data-state="{{page-status}}" data-boris-search-exclude>{{page-status}}</p>
            <div class="credit-line" data-boris-search-exclude>{{metadata}}</div>
          </header>
          <article class="prose lead">{{content}}</article>
          <div class="wire" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
        </main>
        <aside class="rail" aria-label="Front page furniture" data-boris-search-exclude>
          <div class="rail-block"><p class="rail-label">Inside</p>{{toc}}</div>
        </aside>
      </div>
      <section class="edition-index" data-boris-search-exclude>
        <p class="edition-label"><span>In this edition</span><span aria-hidden="true">turn to ▸</span></p>
        {{children}}
      </section>
      <footer class="colophon">{{footer}}</footer>
    </div>
  </body>
</html>
