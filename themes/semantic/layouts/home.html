<!doctype html>
<html lang="en" data-layout="home">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semantic</title>
    <link rel="stylesheet" href="{{asset-url assets/css/semantic.css}}">
      {{head}}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header site-header--home">
      <div class="container header-inner">
        <p class="eyebrow">HTML-first documentation</p>
        <p class="site-name">Semantic</p>
        <div class="site-nav" aria-label="Site navigation">{{nav}}</div>
      </div>
    </header>
    <main id="main-content" tabindex="-1" class="container home-grid" data-boris-search-root>
      <article class="hero-card">
        <p class="eyebrow" data-boris-search-exclude>A semantic starting point</p>
        <h1 data-boris-search-exclude>{{title}}</h1>
        {{metadata}}
        <div class="prose">{{content}}
        <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div></div>
      </article>
      <aside class="home-rail" aria-label="Explore this site" data-boris-search-exclude>
        <div class="rail-card">
          <p class="rail-label">Explore</p>
          {{children}}
        </div>
        <div class="rail-card">
          <p class="rail-label">On this page</p>
          {{toc}}
        </div>
      </aside>
    </main>
    <footer class="site-footer">{{footer}}</footer>
  </body>
</html>
