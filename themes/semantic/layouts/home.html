<!doctype html>
<html lang="en" data-theme="semantic" data-layout="home">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{title}}</title>
    <link rel="stylesheet" href="{{asset-url assets/css/semantic.css}}">
    {{head}}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- Landmark: banner. -->
    <header class="banner">
      <div class="banner__inner">
        <p class="wordmark">Semantic</p>
        {{nav}}
      </div>
    </header>

    <!-- Landmark: main. The site index is a contents page, not a hero card. -->
    <main id="main-content" class="shell" tabindex="-1" data-boris-search-root>
      <article class="specimen">
        <div class="prose">{{content}}</div>
        <section class="children children--lead" aria-labelledby="children-heading" data-boris-search-exclude>
          <h2 id="children-heading">Read it in this order</h2>
          {{children}}
        </section>
        <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
        <footer class="record">{{metadata}}</footer>
      </article>
      {{toc}}
    </main>

    <footer class="colophon">{{footer}}</footer>
  </body>
</html>
