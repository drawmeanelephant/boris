<!doctype html>
<html lang="en" data-layout="section">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semantic</title>
    <link rel="stylesheet" href="{{asset-url assets/css/semantic.css}}">
      {{head}}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="container header-inner">
        <p class="eyebrow">HTML-first documentation</p>
        <p class="site-name">Semantic</p>
        <div class="site-nav" aria-label="Site navigation">{{nav}}</div>
      </div>
    </header>
    <main id="main-content" class="container page-grid page-grid--section" data-boris-search-root>
      <article class="reading-column">
        <div class="breadcrumb" aria-label="Breadcrumb">{{breadcrumb}}</div>
        <header class="article-header">
          <p class="eyebrow">Section landing</p>
          <h1>{{title}}</h1>
          {{metadata}}
        </header>
        <div class="prose">{{content}}</div>
        <section class="children-panel children-panel--featured" aria-labelledby="children-heading">
          <h2 id="children-heading">Pages in this section</h2>
          {{children}}
        </section>
        {{relations}}
        {{backlinks}}
      </article>
      <aside class="toc-rail" aria-label="On this page" data-boris-search-exclude>
        <p class="rail-label">On this page</p>
        {{toc}}
      </aside>
    </main>
    <footer class="site-footer">{{footer}}</footer>
  </body>
</html>
