<!doctype html>
<html lang="en" data-layout="cozy-corner">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Cozy</title>
  <link rel="stylesheet" href="{{asset-url assets/cozy.css}}">
  {{head}}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <header class="site-header" role="banner">
      <p class="site-kicker">personal web archive</p>
      <p class="site-title">Cozy</p>
      <p class="tagline">Ramblings, thoughts, and notes</p>
    </header>
    <div class="layout">
      <main id="main-content" class="site-main" tabindex="-1" data-boris-search-root>
        <div class="breadcrumb">{{breadcrumb}}</div>
        <article class="entry entry--{{page-status}}">
          <header class="entry-header">
            <p class="entry-meta" data-boris-search-exclude>hand-coded entry · static archive</p>
            {{metadata}}
          </header>
          <div class="entry-content">{{content}}</div>
          <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
        </article>
        <section class="recent-posts" aria-labelledby="recent-posts" data-boris-search-exclude>
          <h2 id="recent-posts">Recent posts</h2>
          {{children}}
        </section>
      </main>
      <aside class="sidebar" aria-label="Site sidebar">
        <nav class="sidebar-module" aria-label="Site navigation">
          <h2>Navigation</h2>
          {{nav}}
        </nav>
        <section class="sidebar-module toc-module" aria-label="On this page" data-boris-search-exclude>{{toc}}</section>
      </aside>
    </div>
    <footer class="site-footer">{{footer}}</footer>
  </div>
</body>
</html>
