<!doctype html>
<html lang="en" data-theme="reading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Reading</title>
  <link rel="stylesheet" href="{{asset-url assets/reading.css}}">
  {{head}}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header" role="banner">
    <p class="brand">Reading</p>
    {{breadcrumb}}
  </header>
  <div class="shell">
    <nav class="rail" aria-label="Site">{{nav}}</nav>
    <main id="main-content" tabindex="-1" data-boris-search-root>
      {{metadata}}
      <article class="prose">{{content}}</article>
      {{children}}
      {{relations}}
      {{backlinks}}
    </main>
    <aside class="rail rail--toc" aria-label="On this page" data-boris-search-exclude>{{toc}}</aside>
  </div>
  <footer class="site-footer" role="contentinfo">{{footer}}</footer>
</body>
</html>
