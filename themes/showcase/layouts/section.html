<!doctype html>
<html lang="en" data-layout="section" data-theme="boris-showcase">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Section · Showcase</title>
  <link rel="stylesheet" href="{{asset-url assets/css/showcase.css}}">
  <link rel="icon" href="{{asset-url assets/img/mark.svg}}" type="image/svg+xml">
  {{head}}
</head>
<body data-layout="section" data-status="{{page-status}}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="navbar navbar--compact">
    <div class="navbar__brand">
      <img class="navbar__mark" src="{{asset-url assets/img/mark.svg}}" width="24" height="24" alt="">
      <span class="navbar__title">Showcase</span>
      <span class="badge badge--accent">section</span>
    </div>
    {{breadcrumb}}
  </header>
  <main id="main-content" class="section-main" tabindex="-1" data-boris-search-root>
    <div class="card section-intro">
      {{metadata}}
      <article class="prose">
        {{content}}
      </article>
      <section class="children-panel" aria-labelledby="section-children-heading" data-boris-search-exclude>
        <p class="sidebar__label" id="section-children-heading">In this section</p>
        {{children}}
      </section>
      <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
    </div>
    <aside class="card section-children" aria-label="Section navigation" data-boris-search-exclude>
      <p class="sidebar__label">Site</p>
      {{nav}}
      <p class="sidebar__label section-toc-label">On this page</p>
      {{toc}}
    </aside>
  </main>
  <footer class="footer">{{footer}}</footer>
</body>
</html>
