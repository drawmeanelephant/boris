<!doctype html>
<html lang="en" data-layout="home">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service</title>
    <link rel="stylesheet" href="{{asset-url assets/css/service.css}}">
      {{head}}
  </head>
  <body>
    <a class="govuk-skip-link" href="#main-content">Skip to main content</a>
    <header class="govuk-header"><div class="govuk-width-container govuk-header__inner"><div><p class="govuk-caption">Public-service notes</p><p class="govuk-header__logotype">Service</p></div><div class="govuk-service-nav" aria-label="Service navigation">{{nav}}</div></div></header>
    <main id="main-content" class="govuk-width-container govuk-main-wrapper" data-boris-search-root>
      <div class="govuk-panel"><p class="govuk-caption">A calm public-information shell</p><h1 class="govuk-heading-xl">{{title}}</h1>{{metadata}}</div>
      <div class="govuk-grid-row govuk-home-grid">
        <article class="govuk-grid-column-two-thirds"><div class="govuk-body prose">{{content}}
        {{relations}}
        {{backlinks}}</div></article>
        <aside class="govuk-grid-column-one-third" data-boris-search-exclude><div class="govuk-contents-list"><p class="govuk-caption">Start here</p>{{children}}</div><div class="govuk-contents-list"><p class="govuk-caption">On this page</p>{{toc}}</div></aside>
      </div>
    </main>
    <footer class="govuk-footer">{{footer}}</footer>
  </body>
</html>
