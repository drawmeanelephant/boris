<!doctype html>
<html lang="en" data-layout="home">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engineering</title>
    <link rel="stylesheet" href="{{asset-url assets/css/engineering.css}}">
      {{head}}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="primer-header primer-header--home"><div class="primer-container primer-header__inner"><div><p class="primer-kicker">Engineering documentation</p><p class="primer-brand">Engineering</p></div><div class="primer-nav" aria-label="Site navigation">{{nav}}</div></div></header>
    <main id="main-content" class="primer-container primer-home" data-boris-search-root>
      <article class="Box primer-hero"><span class="Label Label--accent">Theme study</span><h1 class="primer-title">{{title}}</h1>{{metadata}}<div class="markdown-body">{{content}}
        {{relations}}
        {{backlinks}}</div></article>
      <aside class="primer-home__rail" data-boris-search-exclude><div class="Box"><p class="primer-kicker">Explore</p>{{children}}</div><div class="Box"><p class="primer-kicker">On this page</p>{{toc}}</div></aside>
    </main>
    <footer class="primer-footer">{{footer}}</footer>
  </body>
</html>
