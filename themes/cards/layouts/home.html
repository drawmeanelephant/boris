<!doctype html>
<html lang="en" data-theme="cards" data-layout="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Cards</title>
  <link rel="stylesheet" href="{{asset-url assets/css/cards.css}}">
  {{head}}
</head>
<body class="cards-home">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="desk-header">
    <p class="brand"><span class="brand__mark" aria-hidden="true">▤</span> Cards<span class="brand__note">A place for useful things.</span></p>
    <details class="index-drawer" data-boris-search-exclude>
      <summary>Open the index</summary>
      <div class="index-drawer__body">{{nav}}</div>
    </details>
  </header>
  <main id="content" class="workbench collection" tabindex="-1" data-boris-search-root>
    <div class="filing-path" data-boris-search-exclude>{{breadcrumb}}</div>
    <div class="collection-intro" data-status="{{page-status}}">
      <p class="eyebrow" data-boris-search-exclude>The collection</p>
      <article class="prose">{{content}}</article>
    </div>
    <section class="home-deck" aria-labelledby="deck-heading" data-boris-search-exclude>
      <div class="deck-heading"><h2 id="deck-heading">Pick a card. Go somewhere.</h2><p>Filed here · open to explore</p></div>
      {{children}}
    </section>
    <div class="collection-record" data-boris-search-exclude>
      {{metadata}}
      <details class="card-outline"><summary>Find a line</summary>{{toc}}</details>
    </div>
    <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
  </main>
  <footer class="desk-footer">{{footer}}</footer>
</body>
</html>
