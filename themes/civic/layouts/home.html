<!doctype html>
<html lang="en" data-layout="home">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Civic</title>
    <link rel="stylesheet" href="{{asset-url assets/css/civic.css}}">
    {{head}}
  </head>
  <body>
    <a class="usa-skipnav" href="#main-content">Skip to main content</a>
    <div class="usa-banner"><div class="usa-banner__inner"><strong>Public information theme</strong><span> · local, static, reviewable</span></div></div>
    <header class="usa-header"><div class="grid-container usa-header__inner"><div><p class="usa-kicker">Public information</p><p class="usa-logo">Civic</p></div><div class="usa-nav" aria-label="Site navigation">{{nav}}</div></div></header>
    <main id="main-content" class="grid-container usa-main" data-boris-search-root>
      <section class="usa-hero"><p class="usa-kicker">A durable public-information shell</p><h1 class="usa-heading-xl">{{title}}</h1>{{metadata}}</section>
      <div class="grid-row usa-home-grid">
        <article class="grid-col-8">
          <div class="usa-prose">{{content}}</div>
          {{relations}}
          {{backlinks}}
        </article>
        <aside class="grid-col-4 usa-sidebar" data-boris-search-exclude>
          <div class="usa-card"><p class="usa-kicker">Start here</p>{{children}}</div>
          <div class="usa-card"><p class="usa-kicker">Contents</p>{{toc}}</div>
        </aside>
      </div>
    </main>
    <footer class="usa-footer">{{footer}}</footer>
  </body>
</html>
