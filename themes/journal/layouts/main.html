<!doctype html>
<html lang="en" data-layout="journal-archive">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{title}} // system.log</title>
  <link rel="stylesheet" href="{{asset-url assets/journal.css}}">
  {{head}}
</head>
<body data-status="{{page-status}}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="journal-frame">
    <header class="journal-header" role="banner">
      <p class="prompt" aria-label="shell prompt">root@localhost:~# cat /docs/spec.md</p>
      <p class="site-title">system.log</p>
      <p class="status-line">static archive // load → roll → ignite → reset</p>
      <nav class="journal-nav" aria-label="Archive navigation">{{nav}}</nav>
    </header>

    <main id="main-content" class="journal-main" tabindex="-1" data-boris-search-root>
      <div class="journal-breadcrumb" data-boris-search-exclude>{{breadcrumb}}</div>
      <article class="entry-box">
        <header class="entry-header" data-boris-search-exclude>
          <p class="entry-kicker">DOCUMENT ENTRY</p>
          <div class="userpic" role="img" aria-label="Text userpic: SYS_ADMIN">SYS_ADMIN</div>
          {{metadata}}{{tags}}
        </header>
        <div class="entry-content">{{content}}</div>
      </article>
      <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>

      <section class="archive-children" aria-labelledby="archive-entries" data-boris-search-exclude>
        <h2 id="archive-entries">Archive entries</h2>
        {{children}}
      </section>

      <aside class="journal-toc" aria-label="On this page" data-boris-search-exclude>
        <p class="entry-kicker">ON THIS PAGE</p>
        {{toc}}
      </aside>
    </main>

    <footer class="journal-footer">{{footer}}</footer>
  </div>
</body>
</html>
