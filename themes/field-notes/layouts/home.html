<!doctype html>
<html lang="en" data-theme="field-notes" data-layout="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Field Notes</title>
  <link rel="stylesheet" href="{{asset-url assets/field-notes.css}}">
  {{head}}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="book-cover">
    <div class="book-cover__inner">
      <p class="book-brand">Field Notes<span class="book-brand__sub">log book</span></p>
      {{breadcrumb}}
    </div>
  </header>
  <div class="book-frame">
    <main id="content" class="leaf cover-leaf" tabindex="-1" data-boris-search-root>
      <header class="entry-head">
        <p class="entry-kicker" data-boris-search-exclude>The logbook</p>
        <p class="entry-stamp" data-state="{{page-status}}" data-boris-search-exclude>{{page-status}}</p>
        <div class="entry-fields" data-boris-search-exclude>{{metadata}}</div>
      </header>
      <article class="prose">{{content}}</article>
      <section class="leg-entries cover-legs" aria-labelledby="leg-heading" data-boris-search-exclude>
        <h2 class="leg-heading" id="leg-heading">Legs of the route <small>open one</small></h2>
        {{children}}
      </section>
      <details class="book-index" data-boris-search-exclude>
        <summary>The whole logbook</summary>
        {{nav}}
      </details>
      <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
    </main>
  </div>
  <footer class="book-back">{{footer}}</footer>
</body>
</html>
