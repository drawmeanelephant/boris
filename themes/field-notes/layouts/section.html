<!doctype html>
<html lang="en" data-theme="field-notes" data-layout="section">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Field Notes</title>
  <link rel="stylesheet" href="{{asset-url assets/field-notes.css}}">
  {{head}}
</head>
<body data-layout="section">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <p class="brand" aria-label="Field Notes">
        <span class="brand__mark" aria-hidden="true">PF</span>
        <span class="brand__text">Field Notes</span>
      </p>
      {{breadcrumb}}
    </div>
  </header>
  <div class="section-frame">
    <aside class="section-nav" aria-label="Browse">
      <p class="rail__eyebrow">Browse</p>
      {{nav}}
    </aside>
    <main id="main-content" class="section-reading" tabindex="-1" data-boris-search-root>
      <div class="note-meta" data-boris-search-exclude><p class="note-status note-status--{{page-status}}">{{page-status}}</p>{{parent}}{{tags}}</div>
      <article class="prose">
        {{content}}
      </article>
      <section class="children-panel" aria-labelledby="children-heading" data-boris-search-exclude>
        <p class="rail__eyebrow" id="children-heading">In this section</p>
        {{children}}
      </section>
      <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
    </main>
  </div>
  <footer class="theme-footer" role="contentinfo">{{footer}}</footer>
</body>
</html>
