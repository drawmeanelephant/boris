<!doctype html>
<html lang="en" data-theme="field-notes" data-layout="section">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Field Notes</title>
  <link rel="stylesheet" href="{{asset-url assets/field-notes.css}}">
  {{head}}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="book-cover">
    <div class="book-cover__inner">
      <p class="book-brand">Field Notes<span class="book-brand__sub">log book</span></p>
      {{breadcrumb}}
    </div>
  </header>
  <div class="book-frame">
    <div class="spread">
      <main id="content" class="leaf" tabindex="-1" data-boris-search-root>
        <header class="entry-head">
          <p class="entry-kicker" data-boris-search-exclude>Leg of the route</p>
          <p class="entry-stamp" data-state="{{page-status}}" data-boris-search-exclude>{{page-status}}</p>
          <div class="entry-fields" data-boris-search-exclude>{{metadata}}</div>
        </header>
        <article class="prose">{{content}}</article>
        <section class="leg-entries" aria-labelledby="leg-heading" data-boris-search-exclude>
          <h2 class="leg-heading" id="leg-heading">Entries logged here <small>this leg</small></h2>
          {{children}}
        </section>
        <div class="graph-links" data-boris-search-exclude>{{relations}}{{backlinks}}</div>
      </main>
      <aside class="margin-col" data-boris-search-exclude>
        <div class="margin-block">
          <p class="margin-label">Logbook index</p>
          {{nav}}
        </div>
        <div class="margin-block">
          <p class="margin-label">Marginalia</p>
          {{toc}}
        </div>
      </aside>
    </div>
  </div>
  <footer class="book-back">{{footer}}</footer>
</body>
</html>
