<p><a href="x">x</a> wins over the <a href="/url">x</a> reference definition.</p>
<p><a href="foo">foo</a>(/url) leaves the trailing (url) as literal text.</p>
<p>A <a href="/url">b [[c]] d</a> keeps the wikilink literal inside its link text.</p>
<p><code>[[nope]]</code> in a code span and <a href="http://x/%5B%5Bnope%5D%5D">http://x/[[nope]]</a> in an autolink stay literal.</p>
