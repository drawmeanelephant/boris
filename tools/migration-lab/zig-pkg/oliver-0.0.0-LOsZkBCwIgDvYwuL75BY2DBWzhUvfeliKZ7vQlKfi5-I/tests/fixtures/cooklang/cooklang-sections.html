<article class="recipe">
<section class="ingredients">
<h2>Ingredients</h2>
<ul>
<li class="ingredient" data-quantity="200" data-units="g"><span class="quantity">200 g</span> flour</li>
<li class="ingredient" data-quantity="100" data-units="ml"><span class="quantity">100 ml</span> water</li>
<li class="ingredient" data-quantity="100" data-units="g"><span class="quantity">100 g</span> cheese <span class="preparation">grated</span></li>
<li class="ingredient" data-quantity="50" data-units="g"><span class="quantity">50 g</span> spinach</li>
</ul>
</section>
<section>
<h2>Dough</h2>
<ol class="steps">
<li>Mix <span class="ingredient" data-quantity="200" data-units="g">flour</span> and <span class="ingredient" data-quantity="100" data-units="ml">water</span> together until smooth.</li>
</ol>
</section>
<section>
<h2>Filling</h2>
<ol class="steps">
<li>Combine <span class="ingredient" data-quantity="100" data-units="g">cheese <span class="preparation">grated</span></span> and <span class="ingredient" data-quantity="50" data-units="g">spinach</span>, then season.</li>
</ol>
<aside class="note">Serve the same day.</aside>
</section>
</article>
