<!doctype html>
<html lang="en" data-layout="archive" data-theme="textpattern">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Archive · Textpattern Notes</title>
  <link rel="stylesheet" href="{{asset-url assets/css/textpattern.css}}">
  <link rel="icon" href="{{asset-url assets/img/textpattern-mark.svg}}" type="image/svg+xml">
</head>
<body class="txp-body txp-archive-body" data-layout="archive">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="txp-header txp-header--compact" role="banner">
    <div class="txp-container txp-header-inner">
      <div class="txp-branding" aria-label="Textpattern Notes">
        <img class="txp-brand-mark txp-brand-mark--small" src="{{asset-url assets/img/textpattern-mark.svg}}" width="38" height="38" alt="">
        <span class="txp-site-name">Textpattern Notes</span>
      </div>
      <div class="txp-header-trail">{{breadcrumb}}</div>
    </div>
  </header>

  <main id="main-content" class="txp-container txp-archive-layout" tabindex="-1" data-boris-search-root>
    <section class="txp-paper txp-content txp-archive-intro">
      {{metadata}}
      <article class="txp-article">
        <div class="txp-article-content">
          {{content}}
        </div>
      </article>
      <section class="txp-page-children" aria-labelledby="archive-children-heading">
        <div class="txp-section-heading">
          <p class="txp-overline" id="archive-children-heading">Selected entries</p>
          <span class="txp-section-rule" aria-hidden="true"></span>
        </div>
        {{children}}
      </section>
    </section>
    <aside class="txp-sidebar txp-archive-aside" aria-label="Archive navigation">
      <section class="txp-widget">
        <p class="txp-widget-title">All pages</p>
        <nav class="txp-nav txp-nav--rail" aria-label="All notebook pages">{{nav}}</nav>
      </section>
      <section class="txp-widget">
        <p class="txp-widget-title">On this page</p>
        {{toc}}
      </section>
    </aside>
  </main>

  <footer class="txp-footer" role="contentinfo">{{footer}}</footer>
</body>
</html>
