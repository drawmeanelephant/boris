<!doctype html>
<html lang="en" data-layout="main" data-theme="textpattern">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Textpattern Notes</title>
  <link rel="stylesheet" href="{{asset-url assets/css/textpattern.css}}">
  <link rel="icon" href="{{asset-url assets/img/textpattern-mark.svg}}" type="image/svg+xml">
</head>
<body class="txp-body" data-layout="main">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="txp-header" role="banner">
    <div class="txp-container txp-header-inner">
      <div class="txp-branding" aria-label="Textpattern Notes">
        <img class="txp-brand-mark txp-brand-mark--small" src="{{asset-url assets/img/textpattern-mark.svg}}" width="38" height="38" alt="">
        <span>
          <span class="txp-overline">field notes</span>
          <span class="txp-site-name">Textpattern Notes</span>
        </span>
      </div>
      <div class="txp-header-trail">{{breadcrumb}}</div>
    </div>
  </header>

  <div class="txp-container txp-layout-body">
    <aside class="txp-sidebar txp-sidebar--nav" aria-label="Site navigation">
      <details class="txp-nav-disclosure" open>
        <summary class="txp-widget-title">Browse the notebook</summary>
        <nav class="txp-nav txp-nav--rail" aria-label="Notebook pages">
          {{nav}}
        </nav>
      </details>
    </aside>

    <main id="main-content" class="txp-paper txp-content" tabindex="-1" data-boris-search-root>
      {{metadata}}
      <article class="txp-article">
        <div class="txp-article-content">
          {{content}}
        </div>
      </article>
      <section class="txp-page-children" aria-labelledby="children-heading">
        <p class="txp-widget-title" id="children-heading">Related pages</p>
        {{children}}
      </section>
    </main>

    <aside class="txp-sidebar txp-sidebar--toc" aria-label="On this page">
      <section class="txp-widget">
        <p class="txp-widget-title">On this page</p>
        {{toc}}
      </section>
      <section class="txp-widget txp-widget--note">
        <p class="txp-widget-title">Reading note</p>
        <p>Every page is a file. Every trail is part of the graph.</p>
      </section>
    </aside>
  </div>

  <footer class="txp-footer" role="contentinfo">{{footer}}</footer>
</body>
</html>
