<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{title}} · TechDocs</title>
<link rel="stylesheet" href="{{asset-url assets/theme.css}}">
</head>
<body>
<div class="app-container">
<!-- TopNavBar -->
<header class="header">
<div class="flex items-center gap-md">
<span class="header-logo">TechDocs</span>
</div>
<div class="header-links">
<a class="header-link active" href="#">Documentation</a>
<a class="header-link" href="#">Reference</a>
<a class="header-link" href="#">Guides</a>
<a class="header-link" href="#">Community</a>
</div>
<div class="header-actions">
<div class="search-container" data-boris-search-ui>
<form action="_boris/search/" method="get" role="search" data-boris-search-form>
<svg class="search-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<input id="site-search-input" class="search-input" name="q" placeholder="Search documentation (Press '/' to focus)..." type="search" autocomplete="off" spellcheck="false" aria-label="Search documentation"/>
<p class="site-search__status" data-boris-search-status role="status" aria-live="polite"></p>
<ol class="site-search__results" data-boris-search-results aria-label="Search results"></ol>
</form>
</div>
<button class="icon-btn" aria-label="Toggle theme">
<svg class="w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="icon-btn" aria-label="Settings">
<svg class="w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</header>
<div class="main-wrapper">
<!-- SideNavBar -->
<aside class="sidebar">
<div style="padding: 0 var(--spacing-lg) var(--spacing-xl) var(--spacing-lg);">
<h2 style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-on-surface); margin: 0; border: none; padding: 0;">API Reference</h2>
<p style="font-size: 14px; color: var(--color-on-surface-variant); margin-top: 4px; margin-bottom: 0;">v2.4.0</p>
</div>
<details class="mobile-nav-details" open>
      <summary class="mobile-nav-summary font-body-md">Menu</summary>
      <div class="mobile-nav-wrapper">
        {{nav}}
      </div>
    </details>
</aside>
<!-- Main Content Area -->
<main class="content-area" data-boris-search-root>
      <article>
        {{breadcrumb}}
        <div class="boris-content">
          {{content}}
        </div>
        {{footer}}
      </article>
    </main>
<!-- Table of Contents (Right Aside) -->
<aside class="toc-sidebar" aria-label="Table of Contents">
      {{toc}}
    </aside>
</div>
<!-- Footer -->
</div>
<script>
(function() {
  const container = document.querySelector("[data-boris-search-ui]");
  if (!container) return;
  const input = container.querySelector("input[type=search], input.search-input");
  const form = container.querySelector("form") || container;
  const results = container.querySelector("[data-boris-search-results]");
  const status = container.querySelector("[data-boris-search-status]");
  if (!input || !results || !status) return;

  const expectedFormat = "boris-rendered-search-index";
  const expectedSchema = 1;
  // Derive site-root-relative prefix from the page-relative theme stylesheet href
  // emitted by asset-url ("" from index.html, "../" from nested pages, …).
  const siteRootPrefix = (() => {
    const sheet = document.querySelector('link[rel="stylesheet"][href*="assets/"]');
    const href = sheet ? (sheet.getAttribute("href") || "") : "";
    const marker = href.lastIndexOf("assets/");
    return marker >= 0 ? href.slice(0, marker) : "";
  })();
  if (form && form.setAttribute) form.action = siteRootPrefix + "_boris/search/";
  const indexUrl = new URL(siteRootPrefix + "_boris/search/search-index.json", document.baseURI).href;
  let documents = [];

  const normalize = text => String(text || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  const scoreDocument = (doc, terms, phrase) => {
    let best = null;
    doc.sections.forEach((section, sectionIndex) => {
      const values = [normalize(section.heading), normalize(section.text), normalize(section.code)];
      const title = normalize(doc.title);
      let score = 0;
      terms.forEach(term => {
        if (title.includes(term)) score += 10;
        if (values[0].includes(term)) score += 6;
        if (values[1].includes(term)) score += 2;
        if (values[2].includes(term)) score += 1;
      });
      if (section.level === 1) score += 1;
      if (phrase && (title.includes(phrase) || values.some(value => value.includes(phrase)))) score += 5;
      if (score && (!best || score > best.score)) best = { doc, section, sectionIndex, score };
    });
    return best;
  };

  const excerpt = (section, terms) => {
    const raw = section.text || section.code || section.heading || "";
    if (!raw) return "";
    const lower = normalize(raw);
    const pos = terms.reduce((found, term) => {
      if (found !== -1) return found;
      return lower.indexOf(term);
    }, -1);
    const start = pos <= 40 ? 0 : pos - 40;
    const end = Math.min(raw.length, start + 120);
    const prefix = start > 0 ? "…" : "";
    const suffix = end < raw.length ? "…" : "";
    return prefix + raw.slice(start, end).trim() + suffix;
  };

  const setStatus = message => { status.textContent = message; };
  const render = () => {
    results.replaceChildren();
    const query = normalize(input.value);
    if (!query) {
      results.style.display = "none";
      setStatus("");
      return;
    }
    const terms = query.split(" ").filter(Boolean);
    const matches = documents.map(doc => scoreDocument(doc, terms, query)).filter(Boolean).sort((a, b) => b.score - a.score || String(a.doc.path).localeCompare(String(b.doc.path)) || a.sectionIndex - b.sectionIndex);
    if (!matches.length) {
      results.style.display = "block";
      setStatus("No results");
      return;
    }
    results.style.display = "block";
    setStatus(`${matches.length} result${matches.length === 1 ? "" : "s"}`);
    matches.slice(0, 12).forEach(match => {
      const item = document.createElement("li"); item.className = "site-search__result";
      const link = document.createElement("a"); link.href = new URL(siteRootPrefix + String(match.doc.path).replace(/^\/+/, "") + (match.section.fragment ? "#" + match.section.fragment : ""), document.baseURI).href;
      const title = document.createElement("span"); title.className = "site-search__title"; title.textContent = match.section.heading || match.doc.title;
      const path = document.createElement("span"); path.className = "site-search__path"; path.textContent = String(match.doc.path) + (match.section.fragment ? "#" + String(match.section.fragment) : "");
      const text = document.createElement("span"); text.className = "site-search__excerpt"; text.textContent = excerpt(match.section, terms);
      link.append(title, path, text); item.append(link); results.append(item);
    });
  };

  form.addEventListener("submit", event => { event.preventDefault(); render(); input.focus(); });
  input.addEventListener("input", render);
  document.addEventListener("keydown", event => {
    if (event.key === "/" && document.activeElement !== input && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      event.preventDefault(); input.focus();
    }
    if (event.key === "Escape" && document.activeElement === input) {
      input.value = ""; render(); input.blur();
    }
  });

  fetch(indexUrl, { credentials: "same-origin" }).then(response => {
    if (!response.ok) throw new Error("index request failed");
    return response.json();
  }).then(index => {
    if (!index || index.format !== expectedFormat || index.schema_version !== expectedSchema || !Array.isArray(index.documents)) throw new Error("unsupported search index");
    documents = index.documents.filter(doc => doc && typeof doc.path === "string" && typeof doc.title === "string" && Array.isArray(doc.sections)).map(doc => ({
      path: doc.path,
      title: doc.title,
      sections: doc.sections.filter(section => section && typeof section.level === "number" && typeof section.heading === "string" && typeof section.fragment === "string" && typeof section.text === "string" && typeof section.code === "string")
    }));
  }).catch(() => { documents = []; setStatus("Search index unavailable."); });
})();
</script>
</body></html>
