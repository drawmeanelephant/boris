<!doctype html>
<html lang="en" data-layout="section">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Props / Boris lab</title>
    <link rel="stylesheet" href="{{asset-url assets/css/open-props-laboratory.css}}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="op-header"><div class="op-container op-header__inner"><div><p class="op-kicker">Token laboratory / Boris-native</p><p class="op-brand">Open Props / Boris</p></div><div class="op-nav" aria-label="Site navigation">{{nav}}</div></div></header>
    <main id="main-content" class="op-container op-grid" data-boris-search-root><article class="op-card op-article"><div class="op-breadcrumb" aria-label="Breadcrumb">{{breadcrumb}}</div><p class="op-kicker">Section landing</p><h1 class="op-title">{{title}}</h1>{{metadata}}<div class="op-prose">{{content}}</div><section class="op-card op-card--nested" aria-labelledby="children-heading"><h2 id="children-heading">Pages in this section</h2>{{children}}</section></article><aside class="op-sidebar" aria-label="On this page"><div class="op-card"><p class="op-kicker">On this page</p>{{toc}}</div></aside></main>
    <footer class="op-footer">{{footer}}</footer>
  </body>
</html>
