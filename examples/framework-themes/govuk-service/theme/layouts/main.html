<!doctype html>
<html lang="en" data-layout="main">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GOV.UK / Boris study</title>
    <link rel="stylesheet" href="{{asset-url assets/css/govuk-service.css}}">
  </head>
  <body>
    <a class="govuk-skip-link" href="#main-content">Skip to main content</a>
    <header class="govuk-header">
      <div class="govuk-width-container govuk-header__inner">
        <div><p class="govuk-caption">Service manual / Boris-native</p><p class="govuk-header__logotype">Boris service notes</p></div>
        <div class="govuk-service-nav" aria-label="Service navigation">{{nav}}</div>
      </div>
    </header>
    <main id="main-content" class="govuk-width-container govuk-main-wrapper" data-boris-search-root>
      <div class="govuk-grid-row">
        <article class="govuk-grid-column-two-thirds">
          <div class="govuk-breadcrumbs" aria-label="Breadcrumb">{{breadcrumb}}</div>
          <header><h1 class="govuk-heading-xl">{{title}}</h1>{{metadata}}</header>
          <div class="govuk-body prose">{{content}}</div>
          <section class="govuk-contents-list" aria-labelledby="children-heading">
            <h2 id="children-heading" class="govuk-heading-m">In this section</h2>
            {{children}}
          </section>
        </article>
        <aside class="govuk-grid-column-one-third govuk-contents-rail" aria-label="On this page">
          <p class="govuk-caption">Contents</p>{{toc}}
        </aside>
      </div>
    </main>
    <footer class="govuk-footer">{{footer}}</footer>
  </body>
</html>
