<!doctype html>
<html lang="en" data-layout="home">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boris / semantic</title>
    <link rel="stylesheet" href="{{asset-url assets/css/pico-semantic.css}}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header site-header--home">
      <div class="container header-inner">
        <p class="eyebrow">Pico-inspired / Boris-native</p>
        <p class="site-name">Boris / semantic</p>
        <div class="site-nav" aria-label="Site navigation">{{nav}}</div>
      </div>
    </header>
    <main id="main-content" class="container home-grid" data-boris-search-root>
      <article class="hero-card">
        <p class="eyebrow">A semantic starting point</p>
        <h1>{{title}}</h1>
        {{metadata}}
        <div class="prose">{{content}}</div>
      </article>
      <aside class="home-rail" aria-label="Explore this site">
        <div class="rail-card">
          <p class="rail-label">Explore</p>
          {{children}}
        </div>
        <div class="rail-card">
          <p class="rail-label">On this page</p>
          {{toc}}
        </div>
      </aside>
    </main>
    <footer class="site-footer">{{footer}}</footer>
  </body>
</html>
