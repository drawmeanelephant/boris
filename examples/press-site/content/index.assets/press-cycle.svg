<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">The publishing rhythm</title>
  <desc id="desc">Four paper cards connected in a line: load, mark up, publish, and return.</desc>
  <rect width="960" height="260" fill="#f8f5ef"/>
  <path d="M120 130h720" stroke="#c9c0b3" stroke-width="3" stroke-dasharray="8 10"/>
  <g font-family="Georgia, serif" text-anchor="middle">
    <g transform="translate(120 130)"><circle r="56" fill="#272c30"/><text y="8" fill="#f8f5ef" font-size="22">load</text></g>
    <g transform="translate(360 130)"><circle r="56" fill="#8c2323"/><text y="8" fill="#f8f5ef" font-size="22">mark up</text></g>
    <g transform="translate(600 130)"><circle r="56" fill="#3f474e"/><text y="8" fill="#f8f5ef" font-size="22">publish</text></g>
    <g transform="translate(840 130)"><circle r="56" fill="#d6a04a"/><text y="8" fill="#272c30" font-size="22">return</text></g>
  </g>
</svg>
