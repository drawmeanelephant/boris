<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Boris</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page-width: 78rem;
      --reading-width: 52rem;
      --line: color-mix(in srgb, CanvasText 16%, transparent);
      --soft: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      --accent: #4f7cff;
    }
    body {
      max-width: var(--page-width);
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
      line-height: 1.65;
      background: Canvas;
      color: CanvasText;
    }
    @media (min-width: 48rem) {
      body {
        display: grid;
        grid-template-columns: 15rem minmax(0, 1fr);
        grid-template-areas:
          "nav breadcrumb"
          "nav toc"
          "nav main"
          "nav footer";
        grid-template-rows: auto auto 1fr auto;
        column-gap: 2.5rem;
        row-gap: 0.85rem;
        align-items: start;
      }
      .site-nav { grid-area: nav; }
      .site-sidebar { grid-area: nav; }
      .breadcrumb { grid-area: breadcrumb; }
      .page-toc { grid-area: toc; }
      main { grid-area: main; }
      .site-footer { grid-area: footer; }
    }
    .site-sidebar {
      font-size: 0.9rem;
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: 1rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      background: var(--soft);
      scrollbar-width: thin;
    }
    .site-search {
      margin: 0 0 1rem;
      padding: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      background: var(--soft);
    }
    .site-search__label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.02em;
    }
    .site-search__controls { display: flex; gap: 0.35rem; }
    .site-search input {
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      color: inherit;
      background: Canvas;
      font: inherit;
    }
    .site-search button {
      flex: 0 0 auto;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      color: inherit;
      background: color-mix(in srgb, var(--accent) 15%, Canvas);
      font: inherit;
      cursor: pointer;
    }
    .site-search button:hover,
    .site-search button:focus-visible { background: color-mix(in srgb, var(--accent) 25%, Canvas); }
    .site-search__status { margin: 0.55rem 0 0; font-size: 0.78rem; opacity: 0.72; }
    .site-search__results { margin: 0.65rem 0 0; padding: 0; list-style: none; }
    .site-search__result { margin: 0.55rem 0; }
    .site-search__result a { display: block; color: inherit; text-decoration: none; }
    .site-search__result a:hover,
    .site-search__result a:focus-visible { text-decoration: underline; }
    .site-search__title { display: block; color: color-mix(in srgb, var(--accent) 82%, CanvasText); font-weight: 700; }
    .site-search__path { display: block; font-size: 0.72rem; opacity: 0.62; overflow-wrap: anywhere; }
    .site-search__excerpt { display: block; margin-top: 0.1rem; font-size: 0.78rem; line-height: 1.4; opacity: 0.82; }
    .site-search__fallback { margin: 0.55rem 0 0; font-size: 0.78rem; }
    @media (min-width: 48rem) {
      .site-nav { position: static; max-height: none; }
    }
    .site-nav::before {
      content: "BORIS / DOCUMENTATION";
      display: block;
      margin: 0 0 0.85rem;
      color: color-mix(in srgb, CanvasText 62%, transparent);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .site-nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .site-nav > ul > li { margin: 0.35rem 0; }
    .site-nav ul ul {
      margin: 0.25rem 0 0.5rem 0.25rem;
      padding-left: 0.7rem;
      border-left: 2px solid color-mix(in srgb, CanvasText 15%, transparent);
    }
    .site-nav a {
      display: block;
      padding: 0.18rem 0.35rem;
      border-radius: 0.35rem;
      text-decoration: none;
      color: inherit;
    }
    .site-nav a:hover {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      text-decoration: none;
    }
    .site-nav .is-current > a {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      box-shadow: inset 3px 0 var(--accent);
      font-weight: 750;
    }
    .breadcrumb ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .breadcrumb li:not(:last-child)::after {
      content: "/";
      margin-left: 0.35rem;
      opacity: 0.5;
    }
    .breadcrumb a { color: inherit; }
    main {
      width: 100%;
      max-width: var(--reading-width);
      box-sizing: border-box;
      padding: clamp(1.35rem, 3vw, 2.5rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--soft);
      box-shadow: 0 1rem 3rem color-mix(in srgb, CanvasText 5%, transparent);
    }
    main h1,
    main h2,
    main h3 { line-height: 1.2; letter-spacing: -0.02em; }
    main h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 3.25rem); }
    main h2 { margin-top: 2.25rem; }
    main a { color: color-mix(in srgb, var(--accent) 82%, CanvasText); }
    main img { max-width: 100%; height: auto; }
    main table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    main th, main td { min-width: 9rem; padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    main th { background: color-mix(in srgb, CanvasText 7%, transparent); }
    main pre { overflow-x: auto; padding: 1rem; border-radius: 0.65rem; background: color-mix(in srgb, CanvasText 9%, Canvas); }
    main code { font-size: 0.92em; }
    .admonition {
      margin: 1.25rem 0;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border-left: 4px solid #888;
      background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
    }
    .admonition__title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.75;
      margin: 0 0 0.35rem;
    }
    .admonition__body > :first-child { margin-top: 0; }
    .admonition__body > :last-child { margin-bottom: 0; }
    .admonition--tip { border-left-color: #0a7; }
    .admonition--info { border-left-color: #48a; }
    .admonition--note { border-left-color: #48a; }
    .admonition--warning { border-left-color: #c80; }
    .admonition--danger { border-left-color: #c33; }
    .details {
      margin: 1.25rem 0;
      padding: 0.75rem 1rem;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 0.5rem;
      background: color-mix(in srgb, Canvas 95%, CanvasText 5%);
    }
    .details > summary { cursor: pointer; font-weight: 700; }
    .details__body > :first-child { margin-top: 0.75rem; }
    .details__body > :last-child { margin-bottom: 0; }
    .page-toc {
      font-size: 0.85rem;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
    }
    .page-toc ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .page-toc li { margin: 0.2rem 0; }
    .page-toc__l2 { padding-left: 0.75rem; }
    .page-toc__l3 { padding-left: 1.5rem; }
    .page-toc a { color: inherit; text-decoration: none; }
    .page-toc a:hover { text-decoration: underline; }
    .site-footer {
      max-width: var(--reading-width);
      padding: 1rem 0;
      color: color-mix(in srgb, CanvasText 62%, transparent);
      font-size: 0.8rem;
    }
    @media (min-width: 48rem) {
      .page-toc { max-width: var(--reading-width); }
    }
    @media (max-width: 47.99rem) {
      .site-sidebar { position: static; max-height: none; margin-bottom: 1rem; }
      .site-nav { max-height: 18rem; }
      .breadcrumb { margin-bottom: 0.85rem; }
      main { margin-top: 0.85rem; }
    }
  </style>
</head>
<body>
<aside class="site-sidebar">
<section class="site-search" data-boris-search-ui aria-labelledby="site-search-label">
<form action="/_boris/search/" method="get" role="search">
<label class="site-search__label" id="site-search-label" for="site-search-input">Search documentation</label>
<div class="site-search__controls">
<input id="site-search-input" name="q" type="search" autocomplete="off" placeholder="Search…" spellcheck="false">
<button type="submit">Search</button>
</div>
</form>
<p class="site-search__status" data-boris-search-status role="status" aria-live="polite">Loading search…</p>
<ol class="site-search__results" data-boris-search-results aria-label="Search results"></ol>
<noscript><p class="site-search__fallback">Search needs JavaScript in this static site. Use the documentation navigation above.</p></noscript>
</section>
{{nav}}
</aside>
{{breadcrumb}}
{{toc}}
<main data-boris-search-root>
{{content}}
</main>
<footer class="site-footer">Boris · deterministic documentation compiler · Load → Roll → Ignite → Reset</footer>
<script>
(() => {
  "use strict";
  const ui = document.querySelector("[data-boris-search-ui]");
  if (!ui) return;
  const input = ui.querySelector("#site-search-input");
  const form = ui.querySelector("form");
  const status = ui.querySelector("[data-boris-search-status]");
  const results = ui.querySelector("[data-boris-search-results]");
  const indexUrl = new URL("/_boris/search/search-index.json", document.baseURI);
  const expectedFormat = "boris-rendered-search-index";
  const expectedSchema = 1;
  let documents = [];

  const normalize = value => String(value || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const fields = section => [section.heading, section.text, section.code].map(normalize);
  const excerpt = (section, terms) => {
    const source = String(section.text || section.code || section.heading || "").replace(/\s+/g, " ").trim();
    if (!source) return "";
    const needle = terms.find(term => source.toLowerCase().indexOf(term) >= 0);
    const start = needle ? Math.max(0, source.toLowerCase().indexOf(needle) - 48) : 0;
    return (start ? "…" : "") + source.slice(start, start + 150) + (start + 150 < source.length ? "…" : "");
  };
  const scoreDocument = (doc, terms, phrase) => {
    const title = normalize(doc.title);
    let best = null;
    (Array.isArray(doc.sections) ? doc.sections : []).forEach((section, sectionIndex) => {
      const values = fields(section);
      let score = 0;
      terms.forEach(term => {
        if (title.includes(term)) score += 12;
        if (values[0].includes(term)) score += 8;
        if (values[1].includes(term)) score += 2;
        if (values[2].includes(term)) score += 1;
      });
      if (section.level === 1) score += 1;
      if (phrase && (title.includes(phrase) || values.some(value => value.includes(phrase)))) score += 5;
      if (score && (!best || score > best.score)) best = { doc, section, sectionIndex, score };
    });
    return best;
  };
  const setStatus = message => { status.textContent = message; };
  const render = () => {
    results.replaceChildren();
    const query = normalize(input.value);
    if (!query) { setStatus(documents.length ? "Type to search the site." : "Search index unavailable."); return; }
    const terms = query.split(" ").filter(Boolean);
    const matches = documents.map(doc => scoreDocument(doc, terms, query)).filter(Boolean).sort((a, b) => b.score - a.score || String(a.doc.path).localeCompare(String(b.doc.path)) || a.sectionIndex - b.sectionIndex);
    if (!matches.length) { setStatus("No results. Try a different search."); return; }
    setStatus(`${matches.length} result${matches.length === 1 ? "" : "s"}.`);
    matches.slice(0, 12).forEach(match => {
      const item = document.createElement("li"); item.className = "site-search__result";
      const link = document.createElement("a"); link.href = new URL("/" + String(match.doc.path).replace(/^\/+/, "") + (match.section.fragment ? "#" + match.section.fragment : ""), document.baseURI).href;
      const title = document.createElement("span"); title.className = "site-search__title"; title.textContent = match.section.heading || match.doc.title;
      const path = document.createElement("span"); path.className = "site-search__path"; path.textContent = String(match.doc.path) + (match.section.fragment ? "#" + String(match.section.fragment) : "");
      const text = document.createElement("span"); text.className = "site-search__excerpt"; text.textContent = excerpt(match.section, terms);
      link.append(title, path, text); item.append(link); results.append(item);
    });
  };
  form.addEventListener("submit", event => { event.preventDefault(); render(); input.focus(); });
  input.addEventListener("input", render);
  document.addEventListener("keydown", event => { if (event.key === "/" && document.activeElement !== input && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { event.preventDefault(); input.focus(); } if (event.key === "Escape" && document.activeElement === input) { input.value = ""; render(); } });
  fetch(indexUrl, { credentials: "same-origin" }).then(response => { if (!response.ok) throw new Error("index request failed"); return response.json(); }).then(index => {
    if (!index || index.format !== expectedFormat || index.schema_version !== expectedSchema || !Array.isArray(index.documents)) throw new Error("unsupported search index");
    documents = index.documents.filter(doc => doc && typeof doc.path === "string" && typeof doc.title === "string" && Array.isArray(doc.sections)).map(doc => ({
      path: doc.path,
      title: doc.title,
      sections: doc.sections.filter(section => section && typeof section.level === "number" && typeof section.heading === "string" && typeof section.fragment === "string" && typeof section.text === "string" && typeof section.code === "string")
    }));
    render();
  }).catch(() => { documents = []; setStatus("Search index unavailable."); });
})();
</script>
</body>
</html>
