<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Boris</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page-width: 78rem;
      --reading-width: 52rem;
      --line: color-mix(in srgb, CanvasText 16%, transparent);
      --soft: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      --accent: #4f7cff;
    }
    body {
      max-width: var(--page-width);
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
      line-height: 1.65;
      background: Canvas;
      color: CanvasText;
    }
    @media (min-width: 48rem) {
      body {
        display: grid;
        grid-template-columns: 15rem minmax(0, 1fr);
        grid-template-areas:
          "nav breadcrumb"
          "nav toc"
          "nav main"
          "nav footer";
        grid-template-rows: auto auto 1fr auto;
        column-gap: 2.5rem;
        row-gap: 0.85rem;
        align-items: start;
      }
      .site-nav { grid-area: nav; }
      .breadcrumb { grid-area: breadcrumb; }
      .page-toc { grid-area: toc; }
      main { grid-area: main; }
      .site-footer { grid-area: footer; }
    }
    .site-nav {
      font-size: 0.9rem;
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: 1rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      background: var(--soft);
      scrollbar-width: thin;
    }
    .site-nav::before {
      content: "BORIS / DOCUMENTATION";
      display: block;
      margin: 0 0 0.85rem;
      color: color-mix(in srgb, CanvasText 62%, transparent);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .site-nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .site-nav > ul > li { margin: 0.35rem 0; }
    .site-nav ul ul {
      margin: 0.25rem 0 0.5rem 0.25rem;
      padding-left: 0.7rem;
      border-left: 2px solid color-mix(in srgb, CanvasText 15%, transparent);
    }
    .site-nav a {
      display: block;
      padding: 0.18rem 0.35rem;
      border-radius: 0.35rem;
      text-decoration: none;
      color: inherit;
    }
    .site-nav a:hover {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      text-decoration: none;
    }
    .site-nav .is-current > a {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      box-shadow: inset 3px 0 var(--accent);
      font-weight: 750;
    }
    .breadcrumb ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .breadcrumb li:not(:last-child)::after {
      content: "/";
      margin-left: 0.35rem;
      opacity: 0.5;
    }
    .breadcrumb a { color: inherit; }
    main {
      width: 100%;
      max-width: var(--reading-width);
      box-sizing: border-box;
      padding: clamp(1.35rem, 3vw, 2.5rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--soft);
      box-shadow: 0 1rem 3rem color-mix(in srgb, CanvasText 5%, transparent);
    }
    main h1,
    main h2,
    main h3 { line-height: 1.2; letter-spacing: -0.02em; }
    main h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 3.25rem); }
    main h2 { margin-top: 2.25rem; }
    main a { color: color-mix(in srgb, var(--accent) 82%, CanvasText); }
    main img { max-width: 100%; height: auto; }
    main table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    main th, main td { min-width: 9rem; padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    main th { background: color-mix(in srgb, CanvasText 7%, transparent); }
    main pre { overflow-x: auto; padding: 1rem; border-radius: 0.65rem; background: color-mix(in srgb, CanvasText 9%, Canvas); }
    main code { font-size: 0.92em; }
    .admonition {
      margin: 1.25rem 0;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border-left: 4px solid #888;
      background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
    }
    .admonition__title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.75;
      margin: 0 0 0.35rem;
    }
    .admonition__body > :first-child { margin-top: 0; }
    .admonition__body > :last-child { margin-bottom: 0; }
    .admonition--tip { border-left-color: #0a7; }
    .admonition--info { border-left-color: #48a; }
    .admonition--note { border-left-color: #48a; }
    .admonition--warning { border-left-color: #c80; }
    .admonition--danger { border-left-color: #c33; }
    .details {
      margin: 1.25rem 0;
      padding: 0.75rem 1rem;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 0.5rem;
      background: color-mix(in srgb, Canvas 95%, CanvasText 5%);
    }
    .details > summary { cursor: pointer; font-weight: 700; }
    .details__body > :first-child { margin-top: 0.75rem; }
    .details__body > :last-child { margin-bottom: 0; }
    .page-toc {
      font-size: 0.85rem;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
    }
    .page-toc ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .page-toc li { margin: 0.2rem 0; }
    .page-toc__l2 { padding-left: 0.75rem; }
    .page-toc__l3 { padding-left: 1.5rem; }
    .page-toc a { color: inherit; text-decoration: none; }
    .page-toc a:hover { text-decoration: underline; }
    .site-footer {
      max-width: var(--reading-width);
      padding: 1rem 0;
      color: color-mix(in srgb, CanvasText 62%, transparent);
      font-size: 0.8rem;
    }
    @media (min-width: 48rem) {
      .page-toc { max-width: var(--reading-width); }
    }
    @media (max-width: 47.99rem) {
      .site-nav { max-height: 18rem; margin-bottom: 1rem; }
      .breadcrumb { margin-bottom: 0.85rem; }
      main { margin-top: 0.85rem; }
    }
  </style>
</head>
<body>
{{nav}}
{{breadcrumb}}
{{toc}}
<main data-boris-search-root>
{{content}}
</main>
<footer class="site-footer">Boris · deterministic documentation compiler · Load → Roll → Ignite → Reset</footer>
</body>
</html>
