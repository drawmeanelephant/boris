name: CI

on:
  push:
    branches: [main, afterparty]
  pull_request:
    branches: [main, afterparty]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      migration_lab: ${{ steps.filter.outputs.migration_lab }}
      standalone_tools: ${{ steps.filter.outputs.standalone_tools }}
      testdata_generator: ${{ steps.filter.outputs.testdata_generator }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Empty token forces git-based change detection (fetch-depth: 0 above).
      # The default PR-files REST API has returned GitHub Unicorn/5xx HTML,
      # failing this job and skipping migration-lab-test even when the lab
      # paths changed. Local git avoids that dependency.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          filters: |
            migration_lab:
              - 'tools/migration-lab/**'
            standalone_tools:
              - 'tools/search-index/**'
              - 'tools/docs-maintenance/**'
              - 'src/search_index.zig'
            testdata_generator:
              - 'tools/testdata-generator/**'

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Markdown rendering is Oliver, a pure-Zig library pinned by content
      # hash in build.zig.zon: no CMake, no host tools, nothing to install.
      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Oliver rendering seam tests
        run: zig build test-render

      # KNOWN RED, deliberately non-gating and deliberately not hidden.
      # `zig build test-publication-fixture` fails on a pristine clone:
      #   src/publication_checks_fixture_test.zig:627
      #   test "preserved-edge-v1 publication bytes are identical across
      #   requested jobs" -> error.BorisExpectationMismatch from
      #   tools/testdata-generator/src/generator.zig:700
      # The other three seeded-fixture harnesses are wired into `zig build
      # test` (build.zig). This one is run here instead of gating on it, so the
      # failure stays observed rather than unobserved, without holding every
      # unrelated change behind a fixture-generator fix. The notice below fires
      # the moment it goes green: wire it into test_step and delete this step.
      - name: Publication checks fixture harness (known red, non-gating)
        run: |
          set +e
          zig build test-publication-fixture
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=known-red carve-out is stale::test-publication-fixture now passes. Add run_publication_fixture_tests to test_step in build.zig and delete this step."
          else
            echo "::warning title=known red::test-publication-fixture failed (exit ${rc}), as expected on this branch. See the comment above this step."
          fi

      - name: Publication conformance
        run: zig build test-publication-conformance

  migration-lab-test:
    name: migration-lab-test (Linux)
    needs: changes
    if: needs.changes.outputs.migration_lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Migration-lab aggregate tests
        run: zig build --build-file tools/migration-lab/build.zig test

  standalone_tools_test:
    name: standalone-tools-test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.standalone_tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Rendered-search CLI tests
        run: zig build --build-file tools/search-index/build.zig test

      - name: Documentation-maintenance tests
        run: zig build --build-file tools/docs-maintenance/build.zig test

  testdata_generator_test:
    name: testdata-generator-test (Linux)
    needs: changes
    if: needs.changes.outputs.testdata_generator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Bounded companion tests
        run: zig build --build-file tools/testdata-generator/build.zig test

  # Dedicated content-audit lane covering tools/content-audit/** and the root
  # build.zig content-audit wiring. Unlike the path-gated tool lanes above,
  # this one runs unconditionally on both OSes: the audit parser is a
  # standalone conformance surface of its own and its lane must never degrade
  # into an unobserved skip (see the strict `ci` aggregate check below, which
  # requires this lane to succeed rather than merely not-fail).
  content-audit-test:
    name: content-audit-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Content-audit build
        run: zig build --build-file tools/content-audit/build.zig

      - name: Content-audit tests
        run: zig build --build-file tools/content-audit/build.zig test

  # The only lane that builds a release binary and then publishes real content.
  # Debug cannot substitute for it: every unit test allocates through
  # std.testing.allocator, a DebugAllocator, which tolerates an invalid free
  # that a release allocator turns into a fatal signal — the process dies after
  # rendering but before the staging tree is committed, so the output directory
  # is left empty with no diagnostic and a nonzero exit is the only symptom.
  release-html-smoke:
    name: release-html-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe

      # Publishes a three-page site through the documented
      # `<main data-boris-search-root>{{content}}</main>` layout, where every
      # search root opens with a heading, then asserts a zero exit and that the
      # pages and the search index were actually written.
      - name: ReleaseSafe HTML publication smoke
        run: zig build -Doptimize=ReleaseSafe test-release-html-smoke

  # Single required status check for branch protection / rulesets.
  ci:
    name: ci
    needs:
      - build-and-test
      - migration-lab-test
      - standalone_tools_test
      - testdata_generator_test
      - content-audit-test
      - release-html-smoke
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require matrix success
        run: |
          build_and_test="${{ needs.build-and-test.result }}"
          migration_lab_test="${{ needs.migration-lab-test.result }}"
          standalone_tools_test="${{ needs.standalone_tools_test.result }}"
          testdata_generator_test="${{ needs.testdata_generator_test.result }}"
          content_audit_test="${{ needs.content-audit-test.result }}"
          release_html_smoke="${{ needs.release-html-smoke.result }}"
          echo "build-and-test result: ${build_and_test}"
          echo "migration-lab-test result: ${migration_lab_test}"
          echo "standalone-tools-test result: ${standalone_tools_test}"
          echo "testdata-generator-test result: ${testdata_generator_test}"
          echo "content-audit-test result: ${content_audit_test}"
          echo "release-html-smoke result: ${release_html_smoke}"
          test "${build_and_test}" = "success"
          test "${migration_lab_test}" = "success" || test "${migration_lab_test}" = "skipped"
          test "${standalone_tools_test}" = "success" || test "${standalone_tools_test}" = "skipped"
          test "${testdata_generator_test}" = "success" || test "${testdata_generator_test}" = "skipped"
          # Content-audit must actually succeed: no skipped/unobserved escape.
          test "${content_audit_test}" = "success"
          # Same for the release smoke: it is the only guard against a release-only
          # crash, so a skip must never read as green.
          test "${release_html_smoke}" = "success"
