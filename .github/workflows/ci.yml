name: CI

on:
  push:
    branches: [main, afterparty]
  pull_request:
    branches: [main, afterparty, 'codex/editor-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      standalone_tools: ${{ steps.filter.outputs.standalone_tools }}
      testdata_generator: ${{ steps.filter.outputs.testdata_generator }}
      job_runner: ${{ steps.filter.outputs.job_runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Empty token forces git-based change detection (fetch-depth: 0 above).
      # The default PR-files REST API has returned GitHub Unicorn/5xx HTML,
      # failing this job and skipping the standalone-tool lanes even when the
      # tool paths changed. Local git avoids that dependency.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          filters: |
            standalone_tools:
              - 'tools/search-index/**'
              - 'tools/docs-maintenance/**'
              - 'src/search_index.zig'
            testdata_generator:
              - 'tools/testdata-generator/**'
            job_runner:
              - 'src/job_runner.zig'
              - 'examples/cloudflare-container/**'
              - 'docs/contracts/cloudflare-container-runner.md'
              - 'scripts/test-job-runner-image.sh'

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-zig redirects all Zig caches into one cross-run-cached
      # directory; a run cancelled mid-build once persisted a partial cache
      # entry (manifest without payload) that then failed every later macOS
      # install deterministically (#735 CI incident). Fresh builds are the
      # honest baseline for the release gate.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon src tools test fixtures

      # Markdown rendering is Oliver, a pure-Zig library pinned by content
      # hash in build.zig.zon: no CMake, no host tools, nothing to install.
      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Oliver rendering seam tests
        run: zig build test-render

      # Seeded publication-checks fixture harness is wired into `zig build
      # test` (build.zig) now that the fixture generator runs green on a
      # pristine clone.
      - name: Publication conformance
        run: zig build test-publication-conformance

      # The standalone GitHub Pages observer has its own build graph; run its
      # fixture tests here so the redirect-policy regression (resolveRedirect)
      # is guarded on every push, not only when the observer is built.
      - name: GitHub Pages observer tests
        run: zig build --build-file tools/github-pages-audit/build.zig test

  # The key-hint conformance lint is a zero-dependency Node script; it runs as
  # its own lane so a hint/handler drift fails within seconds instead of after
  # the multi-minute editor-test lane. The same lint also runs inside
  # `npm run check` in editor-test, keeping the local developer path covered.
  key-hint-lint:
    name: key-hint lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the key-hint conformance lint
        run: node editor/ui/scripts/check-key-hints.mjs

  editor-test:
    name: editor-test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/ui/package-lock.json

      - name: Install editor UI dependencies
        run: npm --prefix editor/ui ci

      # Deps are installed here (with apt Chromium deps) rather than through
      # the gate's own --deps so the npm cache and --with-deps apply; the gate
      # skips its install branch when node_modules is already present.
      - name: Install browser
        run: npm exec --prefix editor/ui -- playwright install --with-deps chromium

      - name: Build the Boris binary under test
        run: zig build

      # The one-shot gate (editor/scripts/test-editor-gate.sh) runs the whole
      # editor-test lane — fmt, host tests, UI checks + build, Playwright e2e,
      # and the live integrations — against ./zig-out/bin/boris and ends every
      # outcome with exactly one machine-readable NDJSON line on stdout. Run it
      # with the log captured so the summary survives a failure: the step then
      # writes the NDJSON line to the job summary via scripts/gate-summary.mjs,
      # and the upload step below keeps log + summary as an artifact for
      # dashboards.
      - name: Full editor gate
        run: |
          set +e
          ./editor/scripts/test-editor-gate.sh ./zig-out/bin/boris >"$RUNNER_TEMP/editor-gate.log" 2>&1
          rc=$?
          set -e
          tail -1 "$RUNNER_TEMP/editor-gate.log" > "$RUNNER_TEMP/editor-gate.json"
          node scripts/gate-summary.mjs "$RUNNER_TEMP/editor-gate.log" "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload editor gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-gate-summary
          path: |
            ${{ runner.temp }}/editor-gate.json
            ${{ runner.temp }}/editor-gate.log

  standalone_tools_test:
    name: standalone-tools-test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.standalone_tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The one-shot gate (scripts/gate-standalone-tools.sh) runs this lane's
      # tool suites and ends with one machine-readable NDJSON line; the step
      # surfaces it as the job summary (scripts/gate-summary.mjs) and the
      # upload below keeps log + summary as an artifact.
      - name: Standalone-tools gate
        run: |
          set +e
          bash scripts/gate-standalone-tools.sh >"$RUNNER_TEMP/standalone-tools-gate.log" 2>&1
          rc=$?
          set -e
          tail -1 "$RUNNER_TEMP/standalone-tools-gate.log" > "$RUNNER_TEMP/standalone-tools-gate.json"
          node scripts/gate-summary.mjs "$RUNNER_TEMP/standalone-tools-gate.log" "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload standalone-tools gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-tools-gate-summary-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/standalone-tools-gate.json
            ${{ runner.temp }}/standalone-tools-gate.log

  testdata_generator_test:
    name: testdata-generator-test (Linux)
    needs: changes
    if: needs.changes.outputs.testdata_generator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Bounded companion tests
        run: zig build --build-file tools/testdata-generator/build.zig test

  job-runner-image:
    name: job-runner smoke (Linux)
    needs: changes
    if: needs.changes.outputs.job_runner == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Native --once smoke
        run: bash scripts/test-job-runner-image.sh

  # Optional, manual-only parity lane: builds the example container image and
  # byte-diffs its artifacts against a native --once run. Deliberately NOT in
  # the required `ci` aggregate: Docker-in-CI proved flaky on this branch, and
  # this is an operator-parity check, not a release gate. The native smoke
  # above stays the required check. Run it with:
  #   gh workflow run ci.yml --ref <branch>
  job-runner-image-parity:
    name: job-runner image parity (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build image and diff artifacts vs native
        run: bash scripts/test-job-runner-image-parity.sh

  # Dedicated content-audit lane covering tools/content-audit/** and the root
  # build.zig content-audit wiring. Unlike the path-gated tool lanes above,
  # this one runs unconditionally on both OSes: the audit parser is a
  # standalone conformance surface of its own and its lane must never degrade
  # into an unobserved skip (see the strict `ci` aggregate check below, which
  # requires this lane to succeed rather than merely not-fail).
  content-audit-test:
    name: content-audit-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The one-shot gate (scripts/gate-content-audit.sh) runs this lane's
      # build + tests and ends with one machine-readable NDJSON line; the step
      # surfaces it as the job summary (scripts/gate-summary.mjs) and the
      # upload below keeps log + summary as an artifact.
      - name: Content-audit gate
        run: |
          set +e
          bash scripts/gate-content-audit.sh >"$RUNNER_TEMP/content-audit-gate.log" 2>&1
          rc=$?
          set -e
          tail -1 "$RUNNER_TEMP/content-audit-gate.log" > "$RUNNER_TEMP/content-audit-gate.json"
          node scripts/gate-summary.mjs "$RUNNER_TEMP/content-audit-gate.log" "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload content-audit gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-audit-gate-summary-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/content-audit-gate.json
            ${{ runner.temp }}/content-audit-gate.log

  # The only lane that builds a release binary and then publishes real content.
  # Debug cannot substitute for it: every unit test allocates through
  # std.testing.allocator, a DebugAllocator, which tolerates an invalid free
  # that a release allocator turns into a fatal signal — the process dies after
  # rendering but before the staging tree is committed, so the output directory
  # is left empty with no diagnostic and a nonzero exit is the only symptom.
  release-html-smoke:
    name: release-html-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      # Markdown rendering is Oliver, a pure-Zig library pinned by content
      # hash in build.zig.zon: no CMake, no host tools, nothing to install.
      # The one-shot gate (scripts/gate-release-html-smoke.sh) runs the
      # ReleaseSafe build + publication smoke and ends with one
      # machine-readable NDJSON line; the step surfaces it as the job summary
      # (scripts/gate-summary.mjs) and the upload below keeps log + summary as
      # an artifact.
      - name: Release HTML smoke gate
        run: |
          set +e
          bash scripts/gate-release-html-smoke.sh >"$RUNNER_TEMP/release-html-smoke-gate.log" 2>&1
          rc=$?
          set -e
          tail -1 "$RUNNER_TEMP/release-html-smoke-gate.log" > "$RUNNER_TEMP/release-html-smoke-gate.json"
          node scripts/gate-summary.mjs "$RUNNER_TEMP/release-html-smoke-gate.log" "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload release-html-smoke gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-html-smoke-gate-summary-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/release-html-smoke-gate.json
            ${{ runner.temp }}/release-html-smoke-gate.log

  # Single required status check for branch protection / rulesets.
  ci:
    name: ci
    needs:
      - build-and-test
      - editor-test
      - key-hint-lint
      - standalone_tools_test
      - testdata_generator_test
      - job-runner-image
      - content-audit-test
      - release-html-smoke
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require matrix success
        run: |
          build_and_test="${{ needs.build-and-test.result }}"
          editor_test="${{ needs.editor-test.result }}"
          key_hint_lint="${{ needs.key-hint-lint.result }}"
          standalone_tools_test="${{ needs.standalone_tools_test.result }}"
          testdata_generator_test="${{ needs.testdata_generator_test.result }}"
          job_runner_image="${{ needs.job-runner-image.result }}"
          content_audit_test="${{ needs.content-audit-test.result }}"
          release_html_smoke="${{ needs.release-html-smoke.result }}"
          echo "build-and-test result: ${build_and_test}"
          echo "editor-test result: ${editor_test}"
          echo "key-hint lint result: ${key_hint_lint}"
          echo "standalone-tools-test result: ${standalone_tools_test}"
          echo "testdata-generator-test result: ${testdata_generator_test}"
          echo "job-runner-image result: ${job_runner_image}"
          echo "content-audit-test result: ${content_audit_test}"
          echo "release-html-smoke result: ${release_html_smoke}"
          test "${build_and_test}" = "success"
          test "${editor_test}" = "success"
          # The lint lane must actually succeed: a skip must never read as green.
          test "${key_hint_lint}" = "success"
          test "${standalone_tools_test}" = "success" || test "${standalone_tools_test}" = "skipped"
          test "${testdata_generator_test}" = "success" || test "${testdata_generator_test}" = "skipped"
          test "${job_runner_image}" = "success" || test "${job_runner_image}" = "skipped"
          # Content-audit must actually succeed: no skipped/unobserved escape.
          test "${content_audit_test}" = "success"
          # Same for the release smoke: it is the only guard against a release-only
          # crash, so a skip must never read as green.
          test "${release_html_smoke}" = "success"
