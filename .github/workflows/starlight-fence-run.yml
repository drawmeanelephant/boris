name: Run staged Starlight fence fix

on:
  pull_request:
    branches: [afterparty]

permissions:
  contents: write

jobs:
  run-staged-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/starlight-code-fence-shield
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Execute staged patch and gates
        run: |
          python3 - <<'PY'
          import subprocess
          import textwrap
          from pathlib import Path

          source = Path('.github/workflows/starlight-fence-fix.yml').read_text()
          wanted = (
              'Apply focused fence-aware fix and regression test',
              'Build and full tests',
              'Focused black-box Starlight proof',
              'Commit focused change and remove staging workflow',
          )
          for name in wanted:
              marker = f'      - name: {name}\n        run: |\n'
              start = source.index(marker) + len(marker)
              end = source.find('\n      - name:', start)
              if end == -1:
                  end = len(source)
              script = textwrap.dedent(source[start:end])
              subprocess.run(['bash', '-euxo', 'pipefail', '-c', script], check=True)
          PY

      - name: Remove wrapper from final patch
        run: |
          git rm .github/workflows/starlight-fence-run.yml
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:codex/starlight-code-fence-shield
