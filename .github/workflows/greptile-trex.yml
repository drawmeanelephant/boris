name: Greptile TREX (opt-in)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trigger:
    name: Trigger Greptile for run-trex
    if: github.event.label.name == 'run-trex' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Request a Greptile review
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body '@greptileai'
