name: Greptile TREX (opt-in)

on:
  # Use the trusted base-branch workflow so fork PRs receive a write-capable
  # token for the comment. This job reads only event metadata and posts a fixed
  # string; it never checks out or executes pull-request code.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trigger:
    name: Trigger Greptile for run-trex
    if: github.event.label.name == 'run-trex' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Request a Greptile review
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body '@greptileai'
